[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opl-release"
version = "1.0.0"
description = "Unified horizontal release platform, reusable workflows, and read-only fleet observer for OPL products and packages."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
opl-release = "opl_release.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
