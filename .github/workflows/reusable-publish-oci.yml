name: Reusable Publish Generic OCI Artifact

on:
  workflow_call:
    inputs:
      image:
        description: Full OCI repository path (e.g. ghcr.io/gaofeng21cn/my-artifact)
        required: true
        type: string
      version:
        description: Immutable SemVer tag
        required: true
        type: string
      artifact_type:
        required: true
        type: string
      source_url:
        required: true
        type: string
      layer_path:
        required: true
        type: string
      layer_media_type:
        required: true
        type: string
      advance_latest_stable:
        required: false
        default: true
        type: boolean
      toolchain_ref:
        required: false
        default: v1
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-oci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/opl-release
          ref: ${{ inputs.toolchain_ref }}
          path: .opl-release
          sparse-checkout: scripts
          persist-credentials: false

      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v1.3.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.1
        with:
          cosign-release: v3.1.1

      - name: Push immutable OCI artifact with preflight and Cosign provenance
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          ARTIFACT_TYPE: ${{ inputs.artifact_type }}
          SOURCE_URL: ${{ inputs.source_url }}
          LAYER_PATH: ${{ inputs.layer_path }}
          LAYER_MEDIA_TYPE: ${{ inputs.layer_media_type }}
          ADVANCE_LATEST: ${{ inputs.advance_latest_stable }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          preflight="$(node .opl-release/scripts/oci-publication-preflight.mjs \
            --ref "${IMAGE}:${VERSION}" \
            --artifact-type "$ARTIFACT_TYPE" \
            --source-url "$SOURCE_URL" \
            --layer "${LAYER_PATH}=${LAYER_MEDIA_TYPE}")"
          action="$(jq -r .action <<<"$preflight")"
          if [ "$action" = reuse ]; then
            digest="$(jq -er .digest <<<"$preflight")"
          else
            pushed="$(oras push --format json "${IMAGE}:${VERSION}" \
              --artifact-type "$ARTIFACT_TYPE" \
              --annotation "org.opencontainers.image.source=${SOURCE_URL}" \
              --annotation "org.opencontainers.image.version=${VERSION}" \
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
              "${LAYER_PATH}:${LAYER_MEDIA_TYPE}")"
            digest="$(jq -er '.digest // .descriptor.digest' <<<"$pushed")"
          fi
          node .opl-release/scripts/oci-publication-preflight.mjs \
            --ref "${IMAGE}@${digest}" \
            --artifact-type "$ARTIFACT_TYPE" \
            --source-url "$SOURCE_URL" \
            --layer "${LAYER_PATH}=${LAYER_MEDIA_TYPE}" \
            --verify-only --expected-digest "$digest" --anonymous
          if [ "$ADVANCE_LATEST" = true ]; then
            oras tag "${IMAGE}@${digest}" latest-stable
            node .opl-release/scripts/oci-publication-preflight.mjs \
              --ref "${IMAGE}:latest-stable" \
              --artifact-type "$ARTIFACT_TYPE" \
              --source-url "$SOURCE_URL" \
              --layer "${LAYER_PATH}=${LAYER_MEDIA_TYPE}" \
              --verify-only --expected-digest "$digest" --anonymous
          fi
