name: Reusable Prepare Release

on:
  workflow_call:
    inputs:
      apply:
        required: false
        default: false
        type: boolean
      toolchain_ref:
        required: false
        default: v1
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: owner
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/opl-release
          ref: ${{ inputs.toolchain_ref }}
          path: controller
          persist-credentials: false

      - name: Run opl-release prepare
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ inputs.apply }}
          PYTHONPATH: controller/src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          args=()
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python3 -B -m opl_release prepare --owner-root owner "${args[@]}" --output "$RUNNER_TEMP/prepare-result.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opl-release-prepare-result-${{ github.run_id }}
          path: ${{ runner.temp }}/prepare-result.json
          if-no-files-found: warn
