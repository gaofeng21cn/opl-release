name: Reusable Publish OPL Package (v2)

on:
  workflow_call:
    secrets:
      PRIVATE_PACKAGE_SIGNING_KEY:
        required: false
      PRIVATE_PACKAGE_SIGNING_PASSWORD:
        required: false
    inputs:
      package_id:
        required: true
        type: string
      version:
        required: true
        type: string
      source_root:
        required: false
        default: '.'
        type: string
      visibility:
        required: false
        default: public
        type: string
      framework_oci_ref:
        description: Released OPL Framework OCI artifact providing the `opl pack` CLI
        required: false
        default: ghcr.io/gaofeng21cn/one-person-lab-framework:latest-stable
        type: string
      toolchain_ref:
        required: false
        default: v1
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout owner repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: owner
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout opl-release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gaofeng21cn/opl-release
          ref: ${{ inputs.toolchain_ref }}
          path: .opl-release
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oras-project/setup-oras@ac735097e22fe643015b0d19645f7c9a69942128 # v1.3.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.1
        with:
          cosign-release: v3.1.1

      - name: Install released OPL Framework CLI from OCI
        env:
          FRAMEWORK_OCI_REF: ${{ inputs.framework_oci_ref }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/opl-framework"
          oras pull "$FRAMEWORK_OCI_REF" -o "$RUNNER_TEMP/opl-framework"
          tar -xzf "$RUNNER_TEMP/opl-framework"/one-person-lab-framework-*.tar.gz -C "$RUNNER_TEMP/opl-framework"
          npm ci --prefix "$RUNNER_TEMP/opl-framework/one-person-lab" --omit=dev --ignore-scripts
          echo "$RUNNER_TEMP/opl-framework/one-person-lab/bin" >> "$GITHUB_PATH"

      - name: Build and verify v2 package archive with released opl CLI
        env:
          PACKAGE_ID: ${{ inputs.package_id }}
          EXPECTED_VERSION: ${{ inputs.version }}
          SOURCE_ROOT: ${{ inputs.source_root }}
          VISIBILITY: ${{ inputs.visibility }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: .opl-release/src
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          set -euo pipefail
          pkg_dir="owner/${SOURCE_ROOT}"
          opl pack inspect "$pkg_dir" --json
          mkdir -p dist/v2-package
          opl pack build "$pkg_dir" --out dist/v2-package --json

          archive="$(ls dist/v2-package/*.oplpack | head -n 1)"
          lock="dist/v2-package/opl-release.lock.json"
          [ -f "$archive" ] && [ -f "$lock" ]

          ns="one-person-lab-packages"
          if [ "$VISIBILITY" = authorized_only ]; then
            ns="one-person-lab-private-packages"
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${ns}/${PACKAGE_ID}"
          source_url="https://github.com/${GITHUB_REPOSITORY}"
          payload="dist/v2-package/payload-manifest.json"
          archive_sha256="sha256:$(sha256sum "$archive" | cut -d' ' -f1)"
          jq -n \
            --arg package_id "$PACKAGE_ID" \
            --arg version "$EXPECTED_VERSION" \
            --arg commit "$GITHUB_SHA" \
            --arg repo "${source_url}.git" \
            --arg source_root "$SOURCE_ROOT" \
            --arg archive_sha256 "$archive_sha256" \
            --slurpfile lock "$lock" \
            '{
              package_format: "v2",
              package_id: $package_id,
              package_version: $version,
              source_commit: $commit,
              source_repo: $repo,
              source_root: $source_root,
              archive_sha256: $archive_sha256,
              file_count: $lock[0].file_count,
              content_lock: {
                algorithm: $lock[0].algorithm,
                canonicalization: $lock[0].canonicalization,
                digest: $lock[0].digest
              }
            }' > "$payload"
          echo "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          preflight="$(node .opl-release/scripts/oci-publication-preflight.mjs \
            --ref "${image}:${EXPECTED_VERSION}" \
            --artifact-type application/vnd.onepersonlab.package.v1 \
            --source-url "$source_url" \
            --layer "${archive}=application/vnd.onepersonlab.package.source.v2+gzip" \
            --layer "${payload}=application/vnd.onepersonlab.package.payload.v1+json" \
            --layer "${lock}=application/vnd.onepersonlab.package.lock.v2+json")"
          if [ "$(jq -r .action <<<"$preflight")" = reuse ]; then
            digest="$(jq -er .digest <<<"$preflight")"
          else
            pushed="$(oras push --format json "${image}:${EXPECTED_VERSION}" \
              --artifact-type application/vnd.onepersonlab.package.v1 \
              --annotation "org.opencontainers.image.source=${source_url}" \
              --annotation "org.opencontainers.image.version=${EXPECTED_VERSION}" \
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
              "${archive}:application/vnd.onepersonlab.package.source.v2+gzip" \
              "${payload}:application/vnd.onepersonlab.package.payload.v1+json" \
              "${lock}:application/vnd.onepersonlab.package.lock.v2+json")"
            digest="$(jq -er '.digest // .descriptor.digest' <<<"$pushed")"
            oras tag "${image}@${digest}" latest-stable
          fi
          python3 -B -m opl_release emit-receipt \
            --subject-id "$PACKAGE_ID" \
            --lane oci \
            --stage published \
            --version "$EXPECTED_VERSION" \
            --commit "$GITHUB_SHA" \
            --published-version "$EXPECTED_VERSION" \
            --published-ref "${image}@${digest}" \
            --published-digest "$digest" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --output "$RUNNER_TEMP/release-receipt.json"

      - name: Upload standard package release receipt
        if: inputs.visibility == 'public'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opl-release-receipt-${{ inputs.package_id }}-oci-${{ github.run_id }}
          path: ${{ runner.temp }}/release-receipt.json
          if-no-files-found: error
          retention-days: 30
